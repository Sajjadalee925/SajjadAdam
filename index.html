*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

  color:white;
  text-align:center;
  padding:40px 15px;

header h1{
  margin:0;
  font-size:40px;

header p{
  font-size:18px;
}

nav{
  background:white;
  padding:15px;

  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #ccc;
}

nav a{
  color:#1769aa;
  text-decoration:none;
  font-weight:bold;
  margin:8px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{

  border-radius:15px;
  box-shadow:0 3px 12px #ddd;
}

.card h2{
  color:#1769aa;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.box{

  border:1px solid #ddd;
}
